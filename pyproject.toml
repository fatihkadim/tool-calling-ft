[project]
name = "tool-calling-ft"
version = "0.1.0"
description = "LoRA vs QLoRA vs DoRA vs Full Fine-Tuning karşılaştırması — Tool Calling görevi üzerinde"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "torchaudio",
    "transformers>=4.46",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "accelerate>=1.0",
    "datasets>=3.0",
    "trl>=0.11",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ipykernel>=6.29",
    "ruff>=0.16.5",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
