# LoRA fine-tuning config
method: lora
base_model: Qwen/Qwen2.5-0.5B
dataset: NousResearch/hermes-function-calling-v1
output_dir: checkpoints/lora

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

training:
  epochs: 3
  batch_size: 2
  grad_accum_steps: 4
  learning_rate: 2e-4
  max_seq_len: 2048
  warmup_ratio: 0.05
  save_steps: 200
  seed: 42
